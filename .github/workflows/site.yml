# Deploys ronumi.agne.uk to Cloudflare Pages on every push to main.
name: Site
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/privacy.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node site/build.mjs
      - run: npx -y wrangler@4.148.0 pages deploy site/dist --project-name ronumi --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 722cd288382c12a1e4b9eceda7889950
