// Opt in only for the bridge device check. Normal and release builds exclude this receiver.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        if (project.path == ':app') {
            project.android.sourceSets.maybeCreate('githubDebug').with {
                kotlin.srcDir(project.rootProject.file('e2e/bridge/fixture'))
                manifest.srcFile(project.rootProject.file('e2e/bridge/fixture/AndroidManifest.xml'))
            }
        }
    }
}
